[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "e-ring-voting"
version = "1.0.0"
description = "Anonymous voting on a proof-of-work chain where double-voting costs a deposit: Scafuro-Zhang one-time traceable ring signatures (hash-only), beacon-assigned groups and key transfers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Daniele Lin" },
    { name = "Niccolò Pagano" },
]
keywords = ["cryptography", "ring-signature", "one-time", "traceable", "post-quantum", "e-voting", "blockchain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    # Ed25519 for account signatures (sponsors, poll creators, payments).
    # The ring signature itself (otrs/) needs only hashlib.
    "cryptography>=41",
]

[project.optional-dependencies]
# The FS07 comparison scheme binds libsodium's Ristretto255 via cffi.
fs07 = ["cffi>=1.15"]
dev = [
    "cffi>=1.15",
    "pytest>=7.0",
    "hypothesis>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["otrs*", "fs07*", "voting*", "chain*"]
exclude = ["legacy*", "tests*", "bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
